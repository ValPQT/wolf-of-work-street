/* ===== GAME LOOK: thick outlines, board-game shadows, pressable buttons ===== */
html{-webkit-tap-highlight-color:transparent}
:root{--hs:0 5px 0 var(--dk);--soft:0 16px 30px -14px rgba(42,17,13,.45)}
body{background-color:var(--bg);background-image:radial-gradient(rgba(42,17,13,.07) 1.3px,transparent 1.5px);background-size:22px 22px}
header{background:transparent}
header::before{content:"";position:absolute;inset:0 -100vw;background:rgba(251,249,244,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:-1}
/* pressable 3D buttons */
.big,.vb,.bb,.go,.navb,.addp,.endi,.gear,.jkb,.stk .sm,.fctl button,.inv,.seg button,.mod,.sm,.tg,.inst button,.undo,.x{border:3px solid var(--dk);box-shadow:var(--hs);transition:transform .1s,box-shadow .1s,background-color .2s}
.big:not([disabled]):active,.vb:active,.bb:active,.go:active,.navb:not([disabled]):active,.addp:active,.endi:active,.gear:active,.jkb:active,.stk .sm:not([disabled]):active,.fctl button:active,.inv:not([disabled]):active,.seg button:active,.mod:active,.sm:active,.tg:not([disabled]):active,.undo:active,.x:active{transform:translateY(4px);box-shadow:0 1px 0 var(--dk)}
.big{border-radius:16px}.vb{border-radius:16px}.bb{border-radius:16px}
.big[disabled],.stk .sm[disabled],.inv[disabled]{box-shadow:0 2px 0 var(--dk)}
.sm{background:#fff}.sm[aria-pressed=true]{background:var(--or)}
.x{background:var(--bg);color:var(--dk);border-width:2.5px;box-shadow:0 3px 0 var(--dk)}
.undo{background:#fff;box-shadow:0 4px 0 var(--red)}.undo:active{box-shadow:0 1px 0 var(--red)}
.tg{box-shadow:0 3px 0 var(--dk);background:#fff}.tg[aria-pressed=true]{background:var(--dk)}
/* cards, panels, tiles: outline + hard shadow + soft depth */
.card{border:3px solid var(--dk);box-shadow:0 8px 0 var(--dk),var(--soft);border-radius:22px}
.ctop{border-bottom:3px solid var(--dk)}
.market{border:3px solid var(--dk);box-shadow:0 8px 0 var(--dk),var(--soft);border-radius:22px;background:var(--pu);background-image:radial-gradient(120% 90% at 85% 0%,rgba(168,146,224,.35),transparent 60%)}
.tiles{gap:16px;margin-top:22px}
.tile{border:3px solid var(--dk);box-shadow:0 6px 0 var(--dk),var(--soft);border-radius:20px;background-image:linear-gradient(160deg,rgba(255,255,255,.18),transparent 45%)}
.tile.on{outline:none;box-shadow:0 6px 0 var(--dk),0 0 0 4px var(--bg),0 0 0 8px var(--or),var(--soft)}
.tile .rank{border:0;width:auto;height:auto;top:12px;right:12px;font-size:15px}
.tile .rank.gold svg{display:block}
.tile .badge{border:2.5px solid var(--dk);background:var(--or);color:var(--dk);top:-14px;box-shadow:0 3px 0 var(--dk)}
.tile .tid{display:flex;align-items:center;gap:8px}
.tile .vr{display:flex;align-items:center;gap:6px}
.st{border:3px solid var(--dk);box-shadow:0 4px 0 var(--dk);border-radius:14px}
.endi,.gear{width:54px;min-height:52px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.gear.solo{position:absolute;top:0;right:0}
.pr{border:3px solid var(--dk);box-shadow:0 4px 0 var(--dk);border-radius:14px}
.addp{background:#fff;border-style:dashed;border-radius:14px}
.inst{border:3px solid var(--dk);box-shadow:0 4px 0 var(--dk);border-radius:14px}
.bell{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 2px;border-top:2px dashed rgba(42,17,13,.18);border-bottom:2px dashed rgba(42,17,13,.18)}
/* no more box-in-a-box */
.seg{background:none;padding:0;gap:10px}
.seg button{background:#fff;border-radius:14px;min-height:56px}
.seg button[aria-pressed=true]{background:var(--dk);color:var(--bg)}
.mod{background:#fff;border-radius:12px;border-width:2.5px;box-shadow:0 3px 0 var(--pu);border-color:var(--pu)}

.inv{background:#fff;border-radius:14px}

.car{padding:4px 4px 14px;border-radius:0;gap:14px;scroll-padding:4px}
.slide{border:3px solid var(--dk);border-radius:22px;box-shadow:0 8px 0 var(--dk)}

.av.sm{width:34px;height:34px;font-size:14px}
.tile .av{box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 6px rgba(251,249,244,.75)}

.steps .sp.ok::before,.steps .sp.now::before{background:var(--pu)}
.steps .sp i{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:3px solid var(--dk);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--dk)}
.steps .sp.ok i{background:var(--pu);color:var(--bg)}
.steps .sp.now i{background:var(--or);box-shadow:0 3px 0 var(--dk)}
.steps .sp.now{color:var(--dk)}

.tape-in b{font-weight:400}.tape-in .u{color:#C9B8FF}.tape-in .dn{color:var(--coral)}.tape-in .eq{color:#CDBFB0}

.slider{display:flex;align-items:center;gap:10px}
.mute{width:48px;height:48px;flex:none;border-radius:14px;background:#fff;border:3px solid var(--dk);box-shadow:0 4px 0 var(--dk);display:flex;align-items:center;justify-content:center}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:14px;border-radius:8px;border:2.5px solid var(--dk);background:linear-gradient(to right,var(--or) var(--p,50%),#fff var(--p,50%));outline-offset:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--red);border:3px solid var(--dk);box-shadow:inset 0 0 0 4px var(--red),inset 0 0 0 7px rgba(251,249,244,.8),0 3px 0 var(--dk);cursor:pointer}

.sw{width:66px;height:38px;flex:none;border-radius:20px;border:3px solid var(--dk);background:var(--sand);position:relative;box-shadow:0 3px 0 var(--dk);transition:background-color .2s}

.sw[aria-pressed=true]{background:var(--pu)}.sw[aria-pressed=true]::after{transform:translateX(27px)}
.test{min-height:40px;padding:0 12px;border-radius:12px;background:#fff;border:2.5px solid var(--dk);box-shadow:0 3px 0 var(--dk);font-weight:700;font-size:13px}
.test:active{transform:translateY(2px);box-shadow:0 1px 0 var(--dk)}

{
/* ================= DATA ================= */

const RISK={L:{n:'Easy',t:60,s:[1,-1]},H:{n:'Hard',t:90,s:[3,-2]}};
const richest=a=>a.reduce((m,p)=>p.v>m.v?p:m,a[0]),poorest=a=>a.reduce((m,p)=>p.v<m.v?p:m,a[0]);
/* Market News: imposed by the add-on. Each one changes the game. */
const NEWS=[
 {t:'Scandal!',d:'The richest employee was late for an important meeting.',f:a=>{const p=richest(a);p.v-=3;return p.name+' loses 3 coins.'}},
 {t:'Team building day!',d:'Everyone had fun together. Team spirit is up.',f:a=>{a.forEach(p=>p.v+=1);return'Everyone wins 1 coin.'}},

let tLeft=45,tRun=false,tInt=null,ac=null;
const actx=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac};
const beep=(f,d)=>{const lv=SFX();if(!lv)return;const c=actx();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.25*lv,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d)}catch(e){}};
/* wolf howl, made with sound synthesis: a gliding tone with vibrato */
/* the real wolf howl (sounds/howl.mp3); the synthesized one is only a backup */
const HOWL=new Audio('./sounds/howl.mp3');HOWL.preload='auto';let howlReady=false;
/* phones only allow sound after a tap: unlock the file on the first tap */
document.addEventListener('pointerdown',()=>{if(howlReady)return;howlReady=true;HOWL.muted=true;HOWL.play().then(()=>{HOWL.pause();HOWL.currentTime=0;HOWL.muted=false}).catch(()=>{HOWL.muted=false})},{once:false,passive:true});
function howl(){if(!VOL())return;try{HOWL.pause();HOWL.currentTime=0;HOWL.muted=false;HOWL.volume=VOL();const p=HOWL.play();if(p&&p.catch)p.catch(()=>synthHowl())}catch(e){synthHowl()}}
function synthHowl(){const c=actx();if(!c)return;try{
 const t=c.currentTime,out=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;lp.connect(out);out.connect(c.destination);
 out.gain.setValueAtTime(0.0001,t);out.gain.exponentialRampToValueAtTime(Math.max(.0002,.35*VOL()),t+.35);out.gain.setValueAtTime(Math.max(.0002,.35*VOL()),t+2.1);out.gain.exponentialRampToValueAtTime(.0001,t+3.2);
 const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(14,t+1.2);lfo.connect(lg);
 [['sawtooth',1,.18],['sine',1,.6],['sine',2,.12]].forEach(([type,mult,vol])=>{const o=c.createOscillator(),g=c.createGain();o.type=type;g.gain.value=vol;
  o.frequency.setValueAtTime(300*mult,t);o.frequency.exponentialRampToValueAtTime(640*mult,t+.7);o.frequency.setValueAtTime(640*mult,t+1.6);o.frequency.exponentialRampToValueAtTime(470*mult,t+3.1);
  lg.connect(o.frequency);o.connect(g);g.connect(lp);o.start(t);o.stop(t+3.3)});
 lfo.start(t);lfo.stop(t+3.3);
}catch(e){}}

function perfDelta(v){ // v: 'S' success, 'F' fail, 'Z' freeze
 if(v==='Z')return 0;const s=RISK[S.risk].s;let d=v==='S'?s[0]:(S.mods.safety?0:s[1]);if(S.mods.dbl)d*=2;if(S.golden)d*=2;return d}
function betDelta(i,v){const b=S.bets[i];if(!b||v==='Z'||b.side==='J'||b.side==='N')return 0;const win=(v==='S')===(b.side==='B');return (win?1:-1)*b.amt*(S.crash?2:1)}
function deltas(){const v=S.verdict,o={};S.players.forEach((p,i)=>o[i]=i===S.cur?perfDelta(v):betDelta(i,v));return o}
function betLabel(i){if(i===S.cur)return'Performer';const b=S.bets[i];if(!b)return'—';if(b.side==='J')return'Joker';if(b.side==='N')return'No coins';return(b.side==='B'?'BUY ':'SELL ')+b.amt}

function tape(){const prev=S.hist.length>1?S.hist[S.hist.length-2].v:null;
 const it=S.players.map((p,i)=>{const d=prev?p.v-prev[i]:0;return`<span><b>${esc(p.tk)}</b> ${p.v} <b class="${d>0?'u':d<0?'dn':'eq'}">${d>0?'▲'+d:d<0?'▼'+(-d):'●'}</b></span>`}).join('');
 return `<div class="tape" aria-hidden="true"><div class="tape-in" style="--tt:${Math.max(14,S.players.length*4)}s">${it}<span>WOWS INDEX ${S.players.reduce((s,p)=>s+p.v,0)}</span>${it}<span>WOWS INDEX ${S.players.reduce((s,p)=>s+p.v,0)}</span></div></div>`}
function market(){
 const prev=S.hist.length>1?S.hist[S.hist.length-2].v:null;
 const order=S.players.map((p,i)=>({...p,i})).sort((a,b)=>b.v-a.v);const rank={};order.forEach((p,r)=>rank[p.i]=r+1);
 return `<div><section class="market"><div class="row2"><span class="blk" style="font-size:18px">The market</span><span style="font-weight:700;font-size:13px;opacity:.8">Soft Coins of each player</span></div><div class="fig"><svg id="chart" role="img" aria-label="Soft Coins of each player after every turn"></svg></div></section>
 <div class="tiles">${S.players.map((p,i)=>{const d=prev?p.v-prev[i]:0,on=i===S.cur;return`<button class="tile ${on?'on':''}" style="--c:${p.c};--k:${p.k}" data-a="pick" data-i="${i}" aria-pressed="${on}" aria-label="${esc(p.name)}, ${p.v} coins">${on?'<span class="badge blk">ON STAGE</span>':''}<span class="rank blk ${rank[i]===1?'gold':''}" aria-label="Rank ${rank[i]}">${rank[i]===1?ICO.crown:'#'+rank[i]}</span><span class="tid">${avatar(p)}<span class="nm">${esc(p.name)}</span></span><span style="display:flex;align-items:flex-end;justify-content:space-between;gap:6px"><span><span class="v blk">${p.v}</span><br><span class="d blk">${d>0?'▲ +'+d:d<0?'▼ '+d:'—'}</span></span>${spark(i)}</span></button>`}).join('')}</div></div>`;
}

/* ================= ON STAGE ================= */
function ringSvg(stroke){const R=2*Math.PI*44,frac=Math.max(0,tLeft)/maxT();return`<svg width="100%" height="100%" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="${stroke}"/><circle cx="50" cy="50" r="44" fill="none" stroke="${tLeft<=10&&tLeft<maxT()?'#FBF9F4':'currentColor'}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(frac*R).toFixed(1)} ${R.toFixed(1)}" transform="rotate(-90 50 50)"/></svg>`}
const top=(lab,title,sub,right='')=>`<div class="ctop"><div><span class="blk" style="font-size:12px;letter-spacing:.08em">${lab}</span><div class="who blk">${title}</div><span class="sub">${sub}</span></div>${right}</div>`;
const steps=k=>`<div class="steps" aria-label="Turn progress: step ${k+1} of 5">${[['Card','card'],['Bets','chip'],['Clock','clock'],['Verdict','gavel'],['Results','coins']].map(([s,ic],i)=>`<span class="sp ${i<k?'ok':i===k?'now':''}"><i>${ICO[ic]}</i>${s}</span>`).join('')}</div>`;
const flags=()=>`${S.crash?'<div class="warn">Market crash: all bets are doubled this round.</div>':''}${S.golden?'<div class="warn">Golden opportunity: this Performer’s result is doubled.</div>':''}`;

function stage(still){
 const pc=still?'':' pop',p=S.players[S.cur],r=RISK[S.risk];
 const up=perfDelta('S'),dn=perfDelta('F');
 const handle=`<button class="handle" data-a="sheetclose" data-sw="1" aria-label="Fold the panel"></button>`;
 let cc='#E59F48',ck='#2A110D',miniT=esc(p.name),miniS='',miniR='',full='';

 if(S.stage==='card'){
  miniS='Draw a card';miniR=p.v+' coins';
  full=`${top('ON STAGE',esc(p.name),quip('card',esc(p.name))+' Draw a card and read it aloud.',`<div class="coin blk"><b>${p.v}</b><small>coins</small></div>`)}
  <div class="cbody">${steps(0)}${flags()}
  <span class="lbl2">Risk written on the card</span>
  <div class="seg" role="group" aria-label="Card risk"><button data-a="risk" data-r="L" aria-pressed="${S.risk==='L'}">Easy · ${S.mods.short?RISK.L.t/2:RISK.L.t} s<br><small>${sgn(RISK.L.s[0]*(S.golden?2:1))} / ${sgn(RISK.L.s[1]*(S.golden?2:1))}</small></button><button data-a="risk" data-r="H" aria-pressed="${S.risk==='H'}">Hard · ${S.mods.short?RISK.H.t/2:RISK.H.t} s<br><small>${sgn(RISK.H.s[0]*(S.golden?2:1))} / ${sgn(RISK.H.s[1]*(S.golden?2:1))}</small></button></div>
  <span class="lbl2">Bonus &amp; malus cards played</span>
  <div class="mods" role="group" aria-label="Bonus and malus cards">${[['short','Short Clock'],['safety','Safety Net'],['dbl','Double Up']].map(([k,t])=>`<button class="mod" data-a="mod" data-k="${k}" aria-pressed="${S.mods[k]}">${t}</button>`).join('')}</div>
  <button class="big blk" style="background:var(--pu);color:var(--bg)" data-a="tobets">OPEN TRADING →</button></div>`;
 }

 else if(S.stage==='bets'){
  cc='#523A85';ck='#FBF9F4';const inv=investors(),done=inv.filter(i=>S.bets[i]).length;miniT='Trading';miniS=done+' / '+inv.length+' bets placed';miniR='';
  if(S.betFor!==null){const i=S.betFor,q=S.players[i],t=S.tmp,max=Math.min(3,q.v);
   full=`${top('SECRET BET',esc(q.name),'Keep the screen hidden from the others!',`<div class="coin blk"><b>${q.v}</b><small>coins</small></div>`)}
   <div class="cbody">
   <span class="lbl2">Will ${esc(p.name)} succeed?</span>
   <div class="bs"><button class="bb buy" data-a="side" data-s="B" aria-pressed="${t.side==='B'}"><b class="blk">BUY</b><small>success</small></button><button class="bb sell" data-a="side" data-s="S" aria-pressed="${t.side==='S'}"><b class="blk">SELL</b><small>fail</small></button></div>
   <span class="lbl2">Stake</span>
   <div class="stk">${[1,2,3].map(n=>`<button class="sm blk" data-a="amt" data-n="${n}" aria-pressed="${t.amt===n}" ${n>max?'disabled':''}>${n}</button>`).join('')}</div>
   ${jokersFree(i)>0?`<button class="jkb" data-a="joker" aria-pressed="${t.side==='J'}">I drew a Joker card: no bet this time</button><p class="hint" style="text-align:center">Show your Joker card to the table!</p>`:''}
   <button class="big blk" style="background:var(--dk);color:var(--bg)" data-a="place" ${(t.side==='J'||(t.side&&t.amt))?'':'disabled'}>PLACE MY BET</button>
   <div class="row2"><span></span><button class="lnk" data-a="betcancel">Cancel</button></div></div>`;
  }else{
   full=`${top('TRADING','Place your bets',quip('bets',esc(p.name))+' Pass the phone: each investor bets in secret.')}
   <div class="cbody">${steps(1)}${flags()}
   <div class="invl">${inv.map(i=>{const q=S.players[i],b=S.bets[i];return`<button class="inv" data-a="betopen" data-i="${i}" ${b&&b.side==='N'?'disabled':''}>${avatar(q,'sm')}<span class="nm2">${esc(q.name)}<small>${q.v} coins</small></span><span class="stt ${b?'ok':''}">${b?(b.side==='N'?'No coins':'✓ Bet placed'):'Tap to bet'}</span></button>`}).join('')}</div>
   <button class="big blk" style="background:var(--red);color:var(--bg)" data-a="validate" ${done<inv.length?'disabled':''}>VALIDATE BETS (${done}/${inv.length})</button>
   <div class="row2"><button class="lnk" data-a="tocard">← Back to the card</button><span></span></div></div>`;
  }
 }

 else if(S.stage==='perf'||S.stage==='tie'){
  const tie=S.stage==='tie';cc=tie?'#F07A5C':p.c;ck=tie?'#2A110D':p.k;miniT=tie?'Final pitch':esc(p.name);miniS=tie?'15 seconds to convince':'Challenge running';miniR=tLeft>0?fmt(tLeft):'TIME!';
  full=`<div class="ctop" style="flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px 18px 22px"><div><span class="blk" style="font-size:12px;letter-spacing:.08em">${tie?'IT’S A TIE · FINAL PITCH':'PERFORMANCE · '+r.n.toUpperCase()+' CARD'}</span><div class="who blk">${esc(p.name)}</div><span class="sub">${tie?'Convince the table in 15 seconds!':'Investors, start the clock!'}</span></div>
  <button class="bigring ${tRun&&tLeft<=10&&tLeft>0?'hot':''} ${tLeft<=0?'over':''}" data-a="tgo" aria-label="${tRun?'Pause':'Start'} the timer">${ringSvg(8)}<span class="blk" role="timer">${tLeft>0?fmt(tLeft):'TIME!'}<small>${tLeft<=0?'time is up':tRun?'tap to pause':'tap to start'}</small></span></button></div>
  <div class="focus">${tie?'':steps(2)}<div class="fctl"><button style="background:var(--sand)" data-a="treset">↺ Reset</button><button class="blk" style="background:var(--dk);color:var(--bg);letter-spacing:.06em" data-a="tgo">${tRun?'PAUSE':tLeft>0&&tLeft<maxT()?'RESUME':'START'}</button><button style="background:var(--sand)" data-a="plus">+15 s</button></div>
  <button class="big blk" style="background:${tLeft<=0?'var(--red)':'var(--sand)'};color:${tLeft<=0?'var(--bg)':'var(--dk)'}" data-a="toverdict">${tie?'VOTE AGAIN →':'GO TO VERDICT →'}</button></div>`;
 }

 else if(S.stage==='verdict'){
  cc='#2A110D';ck='#FBF9F4';miniT='Verdict';miniS='The table debates';
  const again=S.tieDone;
  full=`${top(again?'SECOND VOTE':'VERDICT','The table debates',again?'Still a tie means the market freezes.':'Then vote by majority. Justify your vote in English!')}
  <div class="cbody">${steps(3)}
  <div class="verd3"><button class="vb blk" style="background:var(--red)" data-a="verdict" data-v="F">FAIL<small>${esc(p.name)} ${sgn(dn)}</small></button><button class="vb tie blk" data-a="${again?'freeze':'tie'}">TIE<small>${again?'freeze':'final pitch'}</small></button><button class="vb blk" style="background:var(--pu)" data-a="verdict" data-v="S">SUCCESS<small>${esc(p.name)} ${sgn(up)}</small></button></div>
  <p class="hint">${again?'Still a tie: nobody wins or loses coins, all bets are paid back.':'A tie gives the Performer a 15-second final pitch.'}</p>
  <div class="row2"><button class="lnk" data-a="toperf">← Back to the clock</button><span></span></div></div>`;
 }

 else if(S.stage==='settle'||S.stage==='done'){
  const v=S.verdict,done=S.stage==='done',D=done?S.applied:deltas();
  cc=v==='Z'?'#F1E8DA':v==='S'?'#523A85':'#D95536';ck=v==='Z'?'#2A110D':'#FBF9F4';
  const title=v==='Z'?'Market freeze':v==='S'?'Success':'Fail';miniT=title;miniS=done?'Turn complete':'Check the results';
  const rows=S.players.map((q,i)=>{const d=D[i],on=done||S.on[i]!==false,app=on?d:0;return`<div class="sr ${on?'':'off'}">${avatar(q,'sm')}<span class="nm2">${esc(q.name)}<small>${betLabel(i)}</small></span><b class="blk dl ${app>0?'pos':app<0?'neg':''}">${sgn(app)}</b>${done?`<span class="blk tot">${q.v}</span>`:`<button class="tg" data-a="toggle" data-i="${i}" aria-pressed="${on}" aria-label="Apply the result of ${esc(q.name)}" ${d===0?'disabled':''}>${on?'✓':''}</button>`}</div>`}).join('');
  full=`${top(done?'TURN COMPLETE':'SETTLEMENT',title,done?quip(v,esc(p.name)):'Check each result, untick a line to cancel it, then confirm.')}
  <div class="cbody">${done?'':steps(4)}${v==='Z'?'<p class="hint" style="color:var(--dk);font-size:15px">Still a tie: all bets are paid back.</p>':''}
  <div class="srs">${rows}</div>
  ${done?`<button class="big blk" style="background:var(--dk);color:var(--bg)" data-a="next">NEXT PERFORMER →</button><div class="row2"><span></span><button class="undo" data-a="undo">↺ Undo</button></div>`
  :`<button class="big blk" style="background:var(--red);color:var(--bg)" data-a="confirm">CONFIRM RESULTS</button><div class="row2">${v==='Z'?'<span></span>':'<button class="lnk" data-a="appeal">Appeal won: flip the verdict</button>'}<button class="undo" data-a="toverdict">↺ Back to verdict</button></div>`}</div>`;
 }
 const mini=`<button class="mini" style="--cc:${cc};--ck:${ck}" data-a="sheetopen" data-sw="1" aria-label="Open the On stage panel"><span class="mt"><span>ON STAGE · ${esc(p.name)}</span><b class="blk">${miniT}</b><span>${miniS}</span></span><span class="mclock blk">${miniR}</span><span aria-hidden="true" style="font-size:20px">▲</span></button>`;
 return mini+`<div class="full"><section class="card${pc}" style="--cc:${cc};--ck:${ck}">${handle}${full}</section></div>`;
}

/* ================= END ================= */
function endScreen(){
 const rows=S.players.map(p=>({...p})).sort((a,b)=>b.v-a.v),pod=[rows[1],rows[0],rows[2]],H=[150,190,130];
 return `<section style="display:flex;flex-direction:column;gap:18px;max-width:900px;margin:0 auto;width:100%">
 <div class="hero"><svg class="wolfend" width="80" height="124" aria-hidden="true"><use href="#wolf"/></svg><div><span class="hint">The Wolf of Work Street is</span><h1 class="blk" style="margin:0;font-size:clamp(30px,6vw,48px)">${esc(rows[0].name)}</h1></div></div>
 <div class="podium">${pod.map((p,i)=>p?`<div class="pod" style="--c:${p.c};--k:${p.k};height:${H[i]}px"><span>${esc(p.name)}</span><b class="blk">${p.v}</b><small style="font-weight:700">${i===1?'1st':i===0?'2nd':'3rd'} · coins</small></div>`:'<div></div>').join('')}</div>
 <p class="hint">Check with the coins on the table. If something is different, trust the table and tell the group!</p>
 <div class="coins">${rows.map((p,i)=>`<div class="cn">${avatar(p,'sm')}<span class="nm">${i+1}. ${esc(p.name)}<small>${p.v} Soft Coins</small></span><b class="f blk">${p.v}</b></div>`).join('')}</div>
 <button class="big blk" style="background:var(--or)" data-a="new">NEW GAME</button></section>`;
}

/* ================= RENDER ================= */
function render(){
 pills();const a=$('app');
 if(S.phase==='setup')a.innerHTML=setup();
 else if(S.phase==='rules'){a.innerHTML=rulesScreen();const c=$('car');requestAnimationFrame(()=>goSlide(S.slide||0,false));let t;c.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{const k=Math.round(c.scrollLeft/c.clientWidth);if(k!==S.slide){S.slide=k;syncDots();save()}},80)})}
 else if(S.phase==='end')a.innerHTML=endScreen();
 else{a.innerHTML=`${tape()}<div class="main"><div id="stageCol" class="${S.sheet?'open':''}">${stage()}</div>${market()}</div><div id="scrim" class="${S.sheet&&phone()?'on':''}" data-a="sheetclose"></div>`;drawChart()}
 save();
}
function paintStage(anim){const col=$('stageCol');if(!col)return;col.innerHTML=stage(!anim);col.classList.toggle('open',!!S.sheet);const sc=$('scrim');if(sc)sc.classList.toggle('on',!!S.sheet&&phone());save()}

let ro;
function drawChart(){
 const s=$('chart');if(!s)return;
 const W=s.clientWidth,H=s.clientHeight,n=S.hist.length,pad={l:24,r:46,t:10,b:18};
 const mx=Math.max(20,Math.ceil(Math.max(...S.hist.flatMap(h=>h.v))/5)*5);
 const x=i=>pad.l+(n<2?0:i*(W-pad.l-pad.r)/(n-1)),y=v=>pad.t+(mx-v)*(H-pad.t-pad.b)/mx;
 let g='';[0,mx/2,mx].forEach(v=>{g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#FBF9F4" stroke-opacity=".18"/><text x="${pad.l-6}" y="${y(v)+4}" fill="#FBF9F4" fill-opacity=".7" font-size="11" text-anchor="end" font-family="Archivo" font-weight="700">${v}</text>`});
 S.hist.forEach((h,i)=>{if(h.l==='news')g+=`<circle cx="${x(i)}" cy="${H-pad.b+8}" r="4" fill="#E59F48"/>`});
 const many=S.players.length>8,labels=[];
 S.players.forEach((p,j)=>{if(j===S.cur)return;const pts=S.hist.map((h,i)=>x(i).toFixed(1)+','+y(h.v[j]).toFixed(1)).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="${LINE[j%8]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="${many?.35:.75}"/>`;labels.push({y:y(S.hist[n-1].v[j]),c:LINE[j%8],t:p.tk})});
 const cp=S.players[S.cur],cj=S.cur,cpts=S.hist.map((h,i)=>x(i).toFixed(1)+','+y(h.v[cj]).toFixed(1)).join(' ');
 g+=`<polyline points="${cpts}" fill="none" stroke="#FBF9F4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n-1)}" cy="${y(S.hist[n-1].v[cj])}" r="6" fill="#E59F48" stroke="#FBF9F4" stroke-width="3"/>`;
 labels.push({y:y(S.hist[n-1].v[cj]),c:'#FBF9F4',t:cp.tk});
 labels.sort((a,b)=>a.y-b.y);let last=-99;
 if(!many)labels.forEach(l=>{const yy=Math.max(l.y+4,last+12);last=yy;g+=`<text x="${W-pad.r+8}" y="${yy}" fill="${l.c}" font-size="11" font-family="Archivo Black">${esc(l.t)}</text>`});
 else g+=`<text x="${W-pad.r+8}" y="${y(S.hist[n-1].v[cj])+4}" fill="#FBF9F4" font-size="11" font-family="Archivo Black">${esc(cp.tk)}</text>`;
 s.innerHTML=g;
 if(!ro)ro=new ResizeObserver(()=>drawChart());ro.disconnect();ro.observe(s);
}

/* ================= TIMER ================= */
function tick(){
 if(!tRun)return;tLeft--;
 if(tLeft<=5&&tLeft>0)beep(880,.12);
 if(tLeft<=0){tRun=false;clearInterval(tInt);beep(440,.7);vib([300,100,300])}
 paintStage();
}
function resetTimer(){tRun=false;clearInterval(tInt);tLeft=maxT()}
function startTimer(){if(tLeft<=0)resetTimer();tRun=true;clearInterval(tInt);beep(660,.08);tInt=setInterval(tick,1000)}

/* ================= TURN FLOW ================= */
function newTurn(){S.stage='card';S.bets={};S.betFor=null;S.tmp={};S.verdict=null;S.on={};S.tieDone=false;S.prevV=null;S.jokersSpent=false;S.mods={short:false,safety:false,dbl:false};S.risk='L';resetTimer()}
function confirmResults(){
 const D=deltas();S.prevV=S.players.map(p=>p.v);S.prevJ=S.jokersLeft;
 S.players.forEach((p,i)=>{if(S.on[i]!==false)p.v=Math.max(0,p.v+D[i])});
 if(!S.jokersSpent)S.jokersLeft=Math.max(0,S.jokersLeft-Object.values(S.bets).filter(b=>b.side==='J').length);S.jokersSpent=true;
 S.applied={};S.players.forEach((p,i)=>S.applied[i]=p.v-S.prevV[i]);S.wasGolden=S.golden;snap('turn');S.stage='done';S.sheet=true;beep(S.verdict==='S'?990:S.verdict==='F'?220:330,.25);
 if(S.golden)S.golden=false;
}
function checkBroke(){const out=S.players.filter(p=>p.v<=0);if(!out.length)return false;
 $('modal').innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="bk"><div class="card news pop" style="--cc:#D95536;--ck:#FBF9F4"><div class="ctop"><span class="blk" style="font-size:12px;letter-spacing:.08em">GAME OVER</span><h3 class="blk" id="bk">${esc(out.map(p=>p.name).join(', '))} ${out.length>1?'have':'has'} no coins left!</h3></div><div class="cbody"><p>The rules say the game ends now.</p><button class="big blk" style="background:var(--dk);color:var(--bg)" data-a="end">SEE THE RESULTS</button><button class="lnk" data-a="alertok">Undo first</button></div></div></div>`;return true}

/* ================= CLICKS ================= */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i;
 if(a==='install'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()});return}
 /* settings */

 if(a==='tgl'){const k=b.dataset.k;SET[k]=!SET[k];saveSet();$('modal').innerHTML=settingsBox();const nb=document.querySelector(`[data-a=tgl][data-k=${k}]`);nb&&nb.focus();if(k==='vib'&&SET.vib)vib(60);return}
 if(a==='testvol'){howl();return}
 if(a==='testsfx'){beep(660,.12);setTimeout(()=>beep(990,.15),130);return}
 /* setup */
 if(a==='add'){S.names.push('');render();const ins=document.querySelectorAll('#names input');ins[ins.length-1].closest('.pr').classList.add('new');ins[ins.length-1].focus();return}
 if(a==='rm'){S.names.splice(i,1);render();return}
 if(a==='gm'){S.gameMin=Math.max(10,Math.min(120,S.gameMin+ +b.dataset.d));render();return}
 if(a==='start'){const names=S.names.map(n=>n.trim()).filter(Boolean);if(names.length<4){alertBox('You need at least 4 players.');return}S.phase='rules';S.slide=0;render();scrollTo(0,0);return}
 /* rules */
 if(a==='no'){S.phase='setup';S.slide=0;render();scrollTo(0,0);return}
 if(a==='skip'){goSlide(SLIDES.length,true);return}
 if(a==='prev'){goSlide(S.slide-1,true);return}
 if(a==='nextslide'){goSlide(S.slide+1,true);return}
 if(a==='yes'){const names=S.names.map(n=>n.trim()).filter(Boolean),used={};
  S.players=names.map((n,j)=>{let tk=n.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'P'+(j+1);while(used[tk])tk=tk.slice(0,2)+(j+1);used[tk]=1;return{name:n,tk,v:10,c:COLS[j%6][0],k:COLS[j%6][1]}});
  Object.assign(S,{phase:'play',hist:[],turn:0,cur:0,crash:false,golden:false,lastNews:-1,jokersLeft:2,sheet:true,slide:0,gameEnd:Date.now()+S.gameMin*60000});newTurn();snap('start');bellRung=false;render();scrollTo(0,0);keepAwake();return}
 /* sheet */
 if(a==='sheetopen'){S.sheet=true;paintStage(true);return}
 if(a==='sheetclose'){S.sheet=false;paintStage();return}
 if(a==='pick'){if(S.stage==='card'){S.cur=i;S.sheet=true;render()}else{S.sheet=true;paintStage()}return}
 /* card */
 if(a==='risk'){S.risk=b.dataset.r;resetTimer();paintStage();return}
 if(a==='mod'){S.mods[b.dataset.k]=!S.mods[b.dataset.k];resetTimer();paintStage();return}
 if(a==='tobets'){S.stage='bets';S.betFor=null;S.players.forEach((q,k)=>{if(k!==S.cur&&q.v<=0)S.bets[k]={side:'N',amt:0}});paintStage(true);return}
 /* bets */
 if(a==='tocard'){S.stage='card';S.bets={};paintStage(true);return}
 if(a==='betopen'){S.betFor=i;S.tmp={};paintStage(true);return}
 if(a==='betcancel'){S.betFor=null;S.tmp={};paintStage(true);return}
 if(a==='side'){S.tmp.side=b.dataset.s;if(!S.tmp.amt)S.tmp.amt=null;paintStage();return}
 if(a==='amt'){S.tmp.amt=+b.dataset.n;if(S.tmp.side==='J')S.tmp.side=null;paintStage();return}
 if(a==='joker'){S.tmp={side:'J',amt:0};paintStage();return}
 if(a==='place'){vib(25);const who=S.betFor;S.bets[who]=S.tmp.side==='J'?{side:'J',amt:0}:{side:S.tmp.side,amt:S.tmp.amt};S.betFor=null;S.tmp={};beep(700,.08);setTimeout(()=>beep(1050,.08),90);paintStage(true);const st=document.querySelector(`.inv[data-i="${who}"] .stt`);st&&st.classList.add('just');return}
 if(a==='validate'){S.stage='perf';resetTimer();paintStage(true);return}
 /* clock */
 if(a==='tgo'){if(tRun){tRun=false;clearInterval(tInt)}else startTimer();paintStage();return}
 if(a==='treset'){resetTimer();paintStage();return}
 if(a==='plus'){tLeft+=15;paintStage();return}
 if(a==='toverdict'){tRun=false;clearInterval(tInt);if(S.stage==='tie')S.tieDone=true;S.stage='verdict';S.verdict=null;S.on={};paintStage(true);return}
 if(a==='toperf'){S.stage=S.tieDone?'tie':'perf';paintStage(true);return}
 /* verdict */
 if(a==='verdict'){vib(b.dataset.v==='S'?[40]:[80,60,80]);S.verdict=b.dataset.v;S.on={};S.stage='settle';beep(b.dataset.v==='S'?990:220,.2);paintStage(true);const cd=document.querySelector('#stageCol .card');cd&&cd.classList.add(S.verdict==='F'?'shake':'jelly');return}
 if(a==='tie'){S.stage='tie';resetTimer();paintStage(true);return}
 if(a==='freeze'){S.verdict='Z';S.on={};S.stage='settle';beep(330,.3);paintStage(true);return}
 /* settlement */
 if(a==='toggle'){S.on[i]=S.on[i]===false;paintStage();return}
 if(a==='appeal'){S.verdict=S.verdict==='S'?'F':'S';paintStage();return}
 if(a==='confirm'){vib(S.verdict==='S'?[30,40,30]:[60]);confirmResults();render();fxTiles(S.prevV);const cd=document.querySelector('#stageCol .card');if(S.verdict==='S')chipRain();else if(S.verdict==='F'&&cd)cd.classList.add('shake');else if(cd)cd.classList.add('jelly');checkBroke();return}
 if(a==='undo'){if(S.prevV){S.players.forEach((p,k)=>{p.v=S.prevV[k]});S.jokersSpent=true;S.hist.pop();S.golden=S.wasGolden||false}S.stage='settle';render();return}
 if(a==='next'){S.turn++;S.cur=(S.cur+1)%S.players.length;const wrap=S.cur===0;newTurn();S.sheet=true;render();if(wrap)drawNews();return}
 /* modals & end */
 if(a==='newsok'||a==='alertok'){$('modal').innerHTML='';if(a==='newsok'){render();fxTiles(S.newsPrev);S.newsPrev=null;checkBroke()}return}
 if(a==='endask'){$('modal').innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="eq"><div class="card news pop" style="--cc:#2A110D;--ck:#FBF9F4"><div class="ctop"><span class="blk" style="font-size:12px;letter-spacing:.08em">END GAME</span><h3 class="blk" id="eq">End the game now?</h3></div><div class="cbody"><p>You will see the final ranking. You can still come back to the game.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="big blk" style="background:var(--sand)" data-a="alertok">NO</button><button class="big blk" style="background:var(--red);color:var(--bg)" data-a="end">YES</button></div></div></div></div>`;return}
 if(a==='end'){tRun=false;clearInterval(tInt);S.phase='end';$('modal').innerHTML='';render();letSleep();scrollTo(0,0);setTimeout(()=>{chipRain(40);howl()},500);return}
 if(a==='back'){S.phase='play';render();keepAwake();return}
 if(a==='new'){S={...fresh(),names:S.players.map(p=>p.name),gameMin:S.gameMin};render();return}
});
document.addEventListener('change',e=>{if(e.target.dataset.set==='sfx')beep(880,.1)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.set){const k=t.dataset.set;SET[k]=+t.value;saveSet();t.style.setProperty('--p',t.value+'%');const pc=$('pct-'+k);if(pc)pc.textContent=t.value+'%';return}if(t.dataset.n!==undefined){S.names[+t.dataset.n]=t.value;save()}});


/* ================= ANIMATIONS ================= */
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function fxLayer(){let l=document.querySelector('.fxlayer');if(!l){l=document.createElement('div');l.className='fxlayer';document.body.appendChild(l)}return l}
/* poker chips falling in the team colours */
function chipRain(n=26){if(calm())return;const l=fxLayer(),cols=['#E59F48','#D95536','#523A85','#A892E0','#F07A5C'];
 for(let k=0;k<n;k++){const c=document.createElement('i');c.className='fxchip';c.style.left=rnd(100)+'vw';c.style.setProperty('--c',cols[rnd(cols.length)]);c.style.setProperty('--x',(rnd(160)-80)+'px');c.style.setProperty('--r',(rnd(720)-360)+'deg');c.style.setProperty('--d',(1.6+rnd(14)/10)+'s');c.style.animationDelay=(rnd(60)/100)+'s';l.appendChild(c);setTimeout(()=>c.remove(),4000)}}
function floatAt(el,txt,cls){const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='float '+cls;f.textContent=txt;f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+r.height*0.35)+'px';f.style.position='fixed';fxLayer().appendChild(f);setTimeout(()=>f.remove(),1400)}
/* tiles count from the old value to the new one, with a bump and a floating +n */
function fxTiles(prev){if(!prev)return;S.players.forEach((p,i)=>{const t=document.querySelector(`.tile[data-i="${i}"]`);if(!t)return;const d=p.v-prev[i];if(!d)return;
 const v=t.querySelector('.v');t.classList.add(d>0?'bump-up':'bump-down');floatAt(t,(d>0?'+':'−')+Math.abs(d),d>0?'pos':'neg');
 if(v&&!calm()){const a=prev[i],b=p.v,t0=performance.now();const step=now=>{const k=Math.min(1,(now-t0)/700);v.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};v.textContent=a;requestAnimationFrame(step)}})}
/* the wolf howls before each Market News */
const MOONSTARS=[[38,60],[262,48],[60,210],[250,200],[150,22],[24,140],[278,128]];
function howlScene(done){
 const el=document.createElement('div');el.className='howl';el.setAttribute('role','img');el.setAttribute('aria-label','The wolf howls: market news!');
 el.innerHTML=`<svg class="scene" viewBox="0 0 300 300" aria-hidden="true">
 ${MOONSTARS.map(([x,y])=>`<circle class="star" cx="${x}" cy="${y}" r="2.5" fill="#FBF9F4"/>`).join('')}
 <g class="moon"><circle cx="150" cy="150" r="118" fill="#D95536"/><g class="ring"><circle cx="150" cy="150" r="104" fill="none" stroke="#2A110D" stroke-width="22" stroke-dasharray="26 55"/></g><circle cx="150" cy="150" r="88" fill="#E59F48" stroke="#D95536" stroke-width="4"/></g>
 <g fill="none" stroke-linecap="round" stroke-width="9"><path class="wave" d="M104 96 Q150 58 196 96" stroke="#FBF9F4"/><path class="wave w2" d="M104 96 Q150 58 196 96" stroke="#FBF9F4"/><path class="wave w3" d="M104 96 Q150 58 196 96" stroke="#FBF9F4"/></g>
 <g class="wolfg"><use href="#wolf" x="82" y="96" width="136" height="212"/></g></svg>
 <div class="aw" aria-hidden="true">${'AWOOOO!'.split('').map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('')}</div>
 <div class="lab">MARKET NEWS</div><div class="skiph">Tap to skip</div>`;
 document.body.appendChild(el);howl();
 let fin=false;const end=()=>{if(fin)return;fin=true;el.classList.add('out');setTimeout(()=>{el.remove();done()},calm()?0:330)};
 el.addEventListener('click',end);setTimeout(end,calm()?1400:3600);
}

/* ================= MARKET NEWS ================= */
function drawNews(){
 S.crash=false; // a crash lasts one round only
 let k;do{k=rnd(NEWS.length)}while(k===S.lastNews&&NEWS.length>1);S.lastNews=k;
 const N=NEWS[k];S.wasGolden=false;const eff=N.f(S.players);S.players.forEach(p=>p.v=Math.max(0,p.v));snap('news');
 const c=NC[k%4];
 const html=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="nt"><div class="card news pop" style="--cc:${c};--ck:${c==='#E59F48'?'#2A110D':'#FBF9F4'}"><div class="ctop"><span class="blk" style="font-size:12px;letter-spacing:.08em">MARKET NEWS · END OF ROUND ${round()-1}</span><h3 class="blk" id="nt">${N.t}</h3></div><div class="cbody"><p>${N.d}</p><div class="eff">${esc(eff)}</div><p class="hint">Imposed by the market: apply it on the table too.</p><button class="big blk" style="background:var(--dk);color:var(--bg)" data-a="newsok">BACK TO TRADING</button></div></div></div>`;
 render();S.newsPrev=S.hist[S.hist.length-2].v;
 howlScene(()=>{$('modal').innerHTML=html;const btn=document.querySelector('[data-a=newsok]');btn&&btn.focus()});
}
function alertBox(msg){$('modal').innerHTML=`<div class="modal" role="alertdialog" aria-modal="true"><div class="card news pop" style="--cc:#D95536;--ck:#FBF9F4"><div class="ctop"><h3 class="blk">Wait!</h3></div><div class="cbody"><p>${esc(msg)}</p><button class="big blk" style="background:var(--dk);color:var(--bg)" data-a="alertok">OK</button></div></div></div>`}

/* ================= GESTURES, KEYS, CLOCK ================= */
let ty=null;
document.addEventListener('touchstart',e=>{const t=e.target.closest('[data-sw]');ty=t?e.touches[0].clientY:null},{passive:true});
document.addEventListener('touchend',e=>{if(ty===null)return;const dy=e.changedTouches[0].clientY-ty;ty=null;if(Math.abs(dy)<40)return;S.sheet=dy<0;paintStage()},{passive:true});
document.addEventListener('keydown',e=>{if(S.phase==='rules'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.target.closest('input')){goSlide(S.slide+(e.key==='ArrowRight'?1:-1),true)}
 if(e.key==='Escape'&&S.phase==='play'&&S.sheet&&phone()){S.sheet=false;paintStage()}});
addEventListener('resize',()=>{const sc=$('scrim');if(sc)sc.classList.toggle('on',!!S.sheet&&phone());if(S.phase==='rules')goSlide(S.slide,false)});
let bellRung=false;
setInterval(()=>{if(S.phase!=='play'&&S.phase!=='end')return;const g=$('gclock');if(!g)return;const left=Math.round((S.gameEnd-Date.now())/1000);
 if(left<=0){if(!bellRung){bellRung=true;howl();pills()}}else g.querySelector('b').textContent=fmt(left)},1000);
if(S.phase==='play')resetTimer();
render();
}
</script>

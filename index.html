<!DOCTYPE html>

<title>Wolf of Work Street</title>

<meta name="description" content="Digital add-on for the Wolf of Work Street board game: live stock market, timer and Market News.">

<style>
/* VOICE: clean and colourful, a casino table seen from above
   IDEA: every player is a poker chip / card on the felt, the stage is the challenge card itself
   PICTURE: the stage card coloured by category with the big timer chip, the player chips around it
   COLOUR and TYPE: cream table, flat blocks of orange, red, purple, brown; Archivo Black + Archivo
   LAYOUT: market strip on top, stage card + chip grid side by side; stacks on phones */
@font-face{font-family:'Familjen Grotesk';src:url(./fonts/familjen-grotesk-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Familjen Grotesk';src:url(./fonts/familjen-grotesk-latin-400-italic.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Archivo Black';src:url(./fonts/archivo-black-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Archivo';src:url(./fonts/archivo-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Archivo';src:url(./fonts/archivo-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Archivo';src:url(./fonts/archivo-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Archivo';src:url(./fonts/archivo-latin-700-italic.woff2) format('woff2');font-weight:700;font-style:italic;font-display:swap}
:root{color-scheme:light;--bg:#FBF9F4;--dk:#2A110D;--or:#E59F48;--red:#D95536;--pu:#523A85;--lav:#A892E0;--coral:#F07A5C;--sand:#F1E8DA;--mut:#7A6158}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--dk);font:16px/1.45 'Archivo',system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--pu);outline-offset:3px}
.blk{font-family:'Archivo Black','Archivo',sans-serif;font-weight:400}
.wrap{max-width:1240px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(3vw,14px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(3vw,14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;line-height:.92;font-size:19px}
.brand i{font-family:'Archivo';font-weight:700;font-size:.65em}.brand em{font-style:normal;color:var(--red)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.st{border-radius:16px;padding:8px 14px;display:flex;flex-direction:column;line-height:1.1;min-width:84px}
.st small{font-weight:700;font-size:11px;opacity:.85}.st b{font-size:22px}
.s-or{background:var(--or)}.s-dk{background:var(--dk);color:var(--bg)}.s-pu{background:var(--pu);color:var(--bg)}.s-red{background:var(--red);color:var(--bg)}
.endb{border:2px solid var(--dk);border-radius:16px;padding:0 16px;min-height:52px;font-weight:700}
.main{display:grid;grid-template-columns:420px minmax(0,1fr);gap:18px;align-items:start}
.market{background:var(--pu);color:var(--bg);border-radius:28px;padding:16px 18px 10px}
.fig{position:relative;height:190px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}
.tile{position:relative;border-radius:24px;padding:14px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--c);color:var(--k);transition:transform .15s}
.tile.on{outline:4px solid var(--dk);outline-offset:3px}
.tile .nm{font-weight:700;font-size:16px}.tile .tk{font-size:12px;font-weight:700;opacity:.8}
.tile .v{font-size:44px;line-height:.9}.tile .d{font-size:13px}
.tile .rank{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:2px dashed currentColor;display:flex;align-items:center;justify-content:center;font-size:12px}
.tile .badge{position:absolute;top:-10px;left:14px;background:var(--dk);color:var(--bg);border-radius:999px;padding:3px 10px;font-size:10px;letter-spacing:.08em}
.card{border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 0 0 3px var(--dk)}
.ctop{background:var(--cc);color:var(--ck);padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.who{font-size:30px;line-height:1.02;margin:2px 0}
.ctop .sub{font-weight:700;font-size:14px;opacity:.85}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.tokens{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tok{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;text-align:center;line-height:1.1;min-height:44px}
.tok i{width:44px;height:44px;border-radius:50%;background:var(--c);border:4px dashed rgba(251,249,244,.75);box-shadow:0 0 0 2px var(--c);transition:transform .15s}
.tok[aria-pressed=true] i{transform:scale(1.12);box-shadow:0 0 0 2px var(--c),0 0 0 5px var(--dk)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sand);border-radius:16px;padding:4px;gap:4px}
.seg button{min-height:46px;border-radius:12px;font-weight:700;font-size:15px}
.seg button[aria-pressed=true]{background:var(--dk);color:var(--bg)}
.mods{display:flex;gap:6px;flex-wrap:wrap}
.mod{min-height:40px;padding:0 12px;border-radius:999px;border:2px solid var(--pu);color:var(--pu);font-weight:700;font-size:13px}
.mod[aria-pressed=true]{background:var(--pu);color:var(--bg)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.go{flex:1;min-height:52px;border-radius:16px;background:var(--dk);color:var(--bg);font-size:16px;letter-spacing:.06em}
.sm{min-height:44px;min-width:44px;padding:0 10px;border-radius:12px;background:var(--sand);font-weight:700;font-size:14px}
.sm[aria-pressed=true]{background:var(--or)}
.verd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vb{min-height:72px;border-radius:20px;color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-size:20px}
.vb small{font-family:'Archivo';font-weight:700;font-size:13px;opacity:.9}
.lnk{font-weight:700;text-decoration:underline;min-height:44px;color:var(--mut)}
.addp{min-height:52px;border-radius:16px;border:2px dashed var(--dk);font-weight:700;font-size:15px;width:100%}.addp:hover{background:var(--sand)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.rc{border-radius:24px;padding:16px 18px;background:var(--c);color:var(--k);display:flex;flex-direction:column;gap:6px}.rc h3{margin:0;font-size:20px;line-height:1.1}.rc p,.rc li{margin:0;font-size:15px;font-weight:600;line-height:1.4}.rc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}.rc b{font-weight:700}
.ask{border-radius:28px;box-shadow:0 0 0 3px var(--dk);padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:#fff}.ask h2{margin:0;font-size:clamp(24px,5vw,34px);line-height:1.05}.ask .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.inst{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--pu);color:var(--bg);border-radius:18px;padding:10px 14px;font-weight:700;font-size:14px}.inst button{background:var(--or);color:var(--dk);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700}
.hint{font-size:13px;color:var(--mut);font-weight:600;margin:0}
.big{min-height:60px;border-radius:18px;font-size:18px;letter-spacing:.06em;width:100%}
.modal{position:fixed;inset:0;background:rgba(42,17,13,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.news{max-width:420px;width:100%}.news .ctop{flex-direction:column;align-items:flex-start;gap:4px;padding:22px}
.news h3{margin:0;font-size:32px;line-height:1.02}.news p{margin:0;font-size:17px;font-weight:600}
.eff{background:var(--sand);border-radius:14px;padding:12px;font-weight:700}
.setup{max-width:620px;margin:0 auto;width:100%}
.hero{display:flex;align-items:center;gap:18px;justify-content:center;padding:8px 0}
.hero h1{margin:0;font-size:clamp(34px,8vw,56px);line-height:.92}.hero h1 i{font-family:'Archivo';font-weight:700;font-size:.45em}.hero h1 em{font-style:normal;color:var(--red)}
.pl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pr{display:flex;align-items:center;gap:6px;background:var(--c);color:var(--k);border-radius:16px;padding:6px}
.pr input{background:transparent;color:inherit;border:0;font:inherit;font-size:16px;font-weight:700;min-height:40px;padding:0 6px;width:100%}
.pr input::placeholder{color:inherit;opacity:.6}
.x{width:40px;height:40px;flex:none;border-radius:12px;background:rgba(42,17,13,.15);font-size:20px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px}.step b{min-width:48px;text-align:center;font-size:20px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.pod{border-radius:22px 22px 8px 8px;background:var(--c);color:var(--k);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;gap:2px}
.pod b{font-size:clamp(24px,5vw,38px);line-height:1}.pod span{font-weight:700}
.coins{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cn{border-radius:18px;padding:10px 12px;background:var(--sand);display:flex;align-items:center;gap:8px}
.cn .nm{flex:1;font-weight:700;display:flex;flex-direction:column;line-height:1.15}.cn .nm small{font-weight:600;color:var(--mut)}
.cn input{width:72px;min-height:44px;border-radius:12px;border:2px solid var(--dk);font:inherit;font-size:16px;text-align:center;background:#fff}
.cn .f{font-size:22px;min-width:40px;text-align:right}
@media(max-width:959px){.main{grid-template-columns:minmax(0,1fr)}}
header{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0;margin:-8px 0}
.stats{flex-wrap:nowrap;align-items:stretch}
.endi{width:56px;flex:none;border-radius:16px;border:2px solid var(--dk);display:flex;align-items:center;justify-content:center}
.undo{border:2px solid var(--red);color:var(--red);border-radius:12px;min-height:44px;padding:0 16px;font-weight:700}
.verd3{display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px}
.vb.tie{background:var(--sand);color:var(--dk)}
.mini{display:none}
.handle{display:none}
.focus{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 18px 22px}
.bigring{position:relative;width:min(62vw,250px);aspect-ratio:1}
.bigring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(40px,12vw,62px);line-height:1}
.bigring small{font-family:'Archivo';font-weight:700;font-size:13px;opacity:.75;margin-top:6px}
.fctl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;width:100%;max-width:380px}
.fctl button{min-height:56px;border-radius:16px;font-weight:700}
.rulesw{display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto;width:100%}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;scrollbar-width:none;border-radius:28px}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;background:var(--c);color:var(--k);padding:clamp(22px,5vw,36px);min-height:min(62vh,460px);display:flex;flex-direction:column;justify-content:center;gap:12px}
.slide .num{font-size:13px;letter-spacing:.1em;opacity:.8}
.slide h2{margin:0;font-size:clamp(32px,8vw,48px);line-height:1}
.slide p,.slide li{margin:0;font-size:clamp(16px,4.2vw,19px);font-weight:600;line-height:1.4}
.slide ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.slide b{font-weight:700}
.slide .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--sand);transition:all .2s}.dots i.on{background:var(--dk);width:26px;border-radius:6px}
.navb{min-height:48px;min-width:96px;border-radius:14px;font-weight:700;background:var(--sand)}.navb.dk{background:var(--dk);color:var(--bg)}.navb[disabled]{opacity:.35;cursor:default}
.skip{font-weight:700;text-decoration:underline;color:var(--mut);min-height:44px}
#scrim{display:none}
@media(max-width:959px){
 .stats{width:100%}.st{flex:1}
 .main{padding-bottom:92px}
 #stageCol{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:84vh;overflow-y:auto;overscroll-behavior:contain;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -10px 34px rgba(42,17,13,.28);padding-bottom:env(safe-area-inset-bottom)}
 #stageCol .card{box-shadow:none;border-radius:28px 28px 0 0}
 #stageCol:not(.open) .full{display:none}
 #stageCol.open .mini{display:none}
 .mini{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:10px 18px 12px;background:var(--cc);color:var(--ck);text-align:left;border-radius:28px 28px 0 0;position:relative}
 .mini .mt{flex:1;display:flex;flex-direction:column;line-height:1.15}.mini .mt b{font-size:20px}.mini .mt span{font-size:13px;font-weight:700;opacity:.85}
 .mini .mclock{font-size:22px}
 .mini::before,.handle::before{content:"";position:absolute;top:7px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:currentColor;opacity:.35}
 .handle{display:block;position:absolute;top:0;left:0;right:0;height:22px;color:var(--ck);z-index:2}
 .full{position:relative}
 #scrim.on{display:block;position:fixed;inset:0;background:rgba(42,17,13,.45);z-index:8}
}
@media(min-width:960px){#stageCol{position:sticky;top:96px}}

@media(max-width:520px){.brand .wt{display:none}.st{min-width:0;padding:6px 10px}.st b{font-size:18px}.endb{min-height:44px;padding:0 12px}.stats{gap:6px}.who{font-size:24px}.ring{width:96px;height:96px}.pl{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .v{font-size:36px}.fig{height:150px}.ring span{font-size:22px}.go{flex-basis:100%}}
@media(prefers-reduced-motion:no-preference){#stageCol.open{animation:up .28s ease-out}@keyframes up{from{transform:translateY(40%)}}.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}}.tile:hover{transform:translateY(-3px)}}
</style>
</head>

<script>
{
const CATS=[{k:'Elevator Pitch',s:'Pitch',c:'#E59F48',t:'#2A110D'},{k:'Role-play',s:'Role-play',c:'#523A85',t:'#FBF9F4'},{k:'Taboo',s:'Taboo',c:'#D95536',t:'#FBF9F4'},{k:'Scenario',s:'Scenario',c:'#A892E0',t:'#2A110D'},{k:'Small Talk',s:'Small talk',c:'#2A110D',t:'#FBF9F4'}];
const COLS=[['#E59F48','#2A110D'],['#D95536','#FBF9F4'],['#523A85','#FBF9F4'],['#2A110D','#FBF9F4'],['#A892E0','#2A110D'],['#F07A5C','#2A110D']];
const LINE=['#E59F48','#FF9E80','#FBF9F4','#FFD39A','#C9B8FF','#F07A5C','#E7DCCB','#FFC266'];

const NEWS=[
 {t:'Scandal!',d:'The top employee was late for an important meeting.',f:a=>{const p=top(a);p.v-=3;return p.name+': stock −3'}},
 {t:'Team building day!',d:'Everyone had fun at the escape room. Team spirit is up.',f:a=>{a.forEach(p=>p.v+=1);return'Everyone: stock +1'}},
 {t:'Market crash!',d:'Panic on the trading floor.',f:()=>'All bets are doubled during the next round. Play it on the table.'},
 {t:'Insider tip',d:'Someone heard something at the coffee machine…',f:()=>'The next Performer must reveal the category before choosing their risk.'},
 {t:'Employee of the Month',d:'Everyone deserves a second chance!',f:a=>{const p=low(a);p.v+=2;return p.name+': stock +2'}},
 {t:'Bull market',d:'Investors love reliable people.',f:a=>{const l=a.filter(p=>p.v>=10);l.forEach(p=>p.v+=1);return l.length?'Every stock at 10 or more: +1':'Nobody is at 10 or more. No change.'}},
 {t:'Missed deadline',d:'The project was late. Somebody has to take responsibility.',f:a=>{const p=a[Math.floor(Math.random()*a.length)];p.v-=1;return p.name+' (random): stock −1. Accountability!'}},
 {t:'Calm market',d:'A quiet day at the office.',f:()=>'Nothing happens. Enjoy your coffee.'}
];

/* ---- PWA: install, offline, screen awake ---- */
let deferredPrompt=null,wl=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBox(){
 if(standalone())return'';
 if(deferredPrompt)return'<div class="inst"><span>Play full screen: install the app on this phone.</span><button data-a="install">Install</button></div>';
 if(isIOS)return'<div class="inst"><span>To install: tap Share, then “Add to Home Screen”.</span></div>';
 return'';
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(S.phase==='setup')render()});
addEventListener('appinstalled',()=>{deferredPrompt=null;if(S.phase==='setup')render()});
async function keepAwake(){
 if(!('wakeLock' in navigator)||wl||S.phase!=='play'||document.visibilityState!=='visible')return;
 try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}catch(e){wl=null}
}
function letSleep(){if(wl){wl.release().catch(()=>{});wl=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
const NC=['#D95536','#523A85','#2A110D','#E59F48'];
const KEY='wows-addon-v2';
const fresh=()=>({phase:'setup',names:['Lea','Tom','Ines','Hugo'],gameMin:35,players:[],hist:[],turn:0,cur:0,cat:0,risk:'L',sec:45,mods:{short:false,safety:false,dbl:false},stage:'pick',last:null,gameEnd:0,coins:{},sheet:true,focus:false,slide:0});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=v=>Math.max(0,Math.min(20,v));
const $=id=>document.getElementById(id);
let tLeft=45,tRun=false,tInt=null,ac=null;
const beep=(f,d)=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}};
const fmt=s=>Math.floor(s/60)+':'+String(Math.max(0,s%60)).padStart(2,'0');
const snap=l=>S.hist.push({l,v:S.players.map(p=>p.v)});
const round=()=>S.players.length?Math.floor(S.turn/S.players.length)+1:1;
const maxT=()=>S.stage==='tie'?15:S.mods.short?30:S.sec;
const phone=()=>innerWidth<960;
const FLAG='<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M5 4h14v10H5z" fill="#FBF9F4" stroke="currentColor" stroke-width="1.6"/><path d="M5 4h3.5v2.5H5zM12 4h3.5v2.5H12zM8.5 6.5H12V9H8.5zM15.5 6.5H19V9h-3.5zM5 9h3.5v2.5H5zM12 9h3.5v2.5H12zM8.5 11.5H12V14H8.5zM15.5 11.5H19V14h-3.5z" fill="currentColor"/></svg>';

function pills(){
 const show=S.phase==='play'||S.phase==='end';$('hdr').style.display=show?'':'none';
 if(!show){$('pills').innerHTML='';return}
 const idx=S.players.reduce((s,p)=>s+p.v,0),start=S.players.length*10,ch=start?((idx-start)/start*100):0,left=Math.round((S.gameEnd-Date.now())/1000);
 $('pills').innerHTML=`<div class="st s-or"><small>WOWS INDEX</small><b class="blk">${idx} <span style="font-size:13px">${ch>=0?'▲':'▼'}${Math.abs(ch).toFixed(0)}%</span></b></div>
 <div class="st ${left>0?'s-dk':'s-red'}" id="gclock"><small>${left>0?'BELL IN':'TIME IS UP'}</small><b class="blk">${left>0?fmt(left):'BELL!'}</b></div>
 <div class="st s-pu"><small>ROUND</small><b class="blk">${round()}</b></div>
 ${S.phase==='play'?'<button class="endi" data-a="endask" aria-label="End game" title="End game">'+FLAG+'</button>':'<button class="endi blk" data-a="back" aria-label="Back to the game" title="Back to the game" style="font-size:22px">←</button>'}`;
}

function setup(){
 return `<section class="setup" style="display:flex;flex-direction:column;gap:16px">
 <div class="hero"><svg viewBox="0 0 760 352" style="width:min(420px,88%);height:auto" role="img" aria-label="Wolf of Work Street"><use href="#logo"/></svg></div>
 ${installBox()}
 <span class="blk" style="font-size:20px">Players · ${S.names.length}</span>
 <div class="pl" id="names">${S.names.map((n,i)=>{const c=COLS[i%6];return`<div class="pr" style="--c:${c[0]};--k:${c[1]}"><input type="text" value="${esc(n)}" maxlength="14" data-n="${i}" placeholder="Name" aria-label="Player ${i+1} name"><button class="x" data-a="rm" data-i="${i}" aria-label="Remove player" ${S.names.length<=4?'disabled':''}>×</button></div>`}).join('')}</div>
 <button class="addp" data-a="add">+ Add a player</button>
 <div class="row2" style="background:var(--sand);border-radius:18px;padding:10px 14px"><span style="font-weight:700">Game bell</span><div class="step"><button class="sm" data-a="gm" data-d="-5" aria-label="5 minutes less">−</button><b class="blk">${S.gameMin}</b><span style="font-weight:700">min</span><button class="sm" data-a="gm" data-d="5" aria-label="5 minutes more">+</button></div></div>
 <p class="hint">Minimum 4 players, no maximum. Everyone starts at stock value 10. Soft Coins, bets and cards stay on the table.</p>
 <button class="big blk" style="background:var(--red);color:var(--bg)" data-a="start">OPEN THE MARKET</button></section>`;
}

const SLIDES=[
 ['#E59F48','#2A110D','The goal','<p>Be the <b>richest player</b> at the end of the game.</p><p>You earn money by performing well yourself, and by betting well on the others.</p><p><b>Fortune = Soft Coins + (stock value × 2)</b></p>'],
 ['#523A85','#FBF9F4','Setup','<p>Each player takes <b>10 Soft Coins</b>.</p><p>Every stock starts at <b>10</b>.</p><p>The player who arrived earliest this morning starts. That\'s Punctuality!</p>'],
 ['#2A110D','#FBF9F4','A trading day','<ol><li><b>Opening Bell:</b> the Performer picks a category and a risk. Low +1 / −1, High +3 / −2.</li><li><b>Trading:</b> the others bet BUY or SELL, face down, with 1 to 3 coins.</li><li><b>Performance:</b> tap the timer in the app.</li><li><b>Verdict:</b> the table votes Success or Fail and justifies it.</li><li><b>Settlement:</b> good bets pay double, bad bets go to the bank.</li></ol>'],
 ['#F07A5C','#2A110D','It\'s a tie!','<p>The Performer gets a <b>15-second final pitch</b> to convince the table. Then everyone votes again.</p><p>Still a tie? <b>The market freezes:</b> the stock doesn\'t move and all bets are paid back.</p>'],
 ['#D95536','#FBF9F4','Special cards','<p><b>Appeal</b> (once per game): contest a verdict with a 20-second plea, then the table votes again.</p><p><b>Bonus &amp; malus</b> like Short Clock, Safety Net or Double Up: tap them in the app when they are played.</p>'],
 ['#A892E0','#2A110D','Market News','<p>After each full round of the table, the app draws a <b>market event</b>: a scandal, a crash, an insider tip…</p><p>Its effect is applied automatically.</p>'],
 ['#F1E8DA','#2A110D','End of the game','<p>The game ends when the <b>bell rings</b> or when a player has <b>no coins left</b>.</p><p>Count your coins: the app finds the <b>Wolf of Work Street</b>.</p>']
];
function rulesScreen(){
 const n=S.names.map(x=>x.trim()).filter(Boolean),N=SLIDES.length+1;
 return `<section class="rulesw">
 <div class="row2"><div style="display:flex;align-items:center;gap:10px"><svg width="40" height="62" aria-hidden="true" style="flex:none"><use href="#wolf"/></svg><div><span class="hint">${n.length} players · ${S.gameMin} min</span><h1 class="blk" style="margin:0;font-size:clamp(26px,6vw,36px);line-height:1">How to play</h1></div></div><button class="skip" data-a="skip">Skip rules</button></div>
 <div class="car" id="car" tabindex="0" aria-roledescription="carousel" aria-label="Game rules">
 ${SLIDES.map(([c,k,t,b],i)=>`<article class="slide" style="--c:${c};--k:${k}" aria-label="${i+1} of ${N}"><span class="num blk">${i+1} / ${N}</span><h2 class="blk">${t}</h2>${b}</article>`).join('')}
 <article class="slide" style="--c:#FFFFFF;--k:#2A110D;box-shadow:inset 0 0 0 3px #2A110D;border-radius:28px;align-items:center;text-align:center" aria-label="${N} of ${N}"><svg width="90" height="140" aria-hidden="true"><use href="#wolf"/></svg><h2 class="blk">Do you want to start a game?</h2><div class="two" style="width:100%;max-width:420px"><button class="big blk" style="background:var(--sand)" data-a="no">NO</button><button class="big blk" style="background:var(--red);color:var(--bg)" data-a="yes">YES</button></div></article>
 </div>
 <div class="cnav"><button class="navb" data-a="prev" id="cprev">← Back</button><div class="dots" id="dots">${Array.from({length:N},(_,i)=>`<i></i>`).join('')}</div><button class="navb dk" data-a="nextslide" id="cnext">Next →</button></div>
 </section>`;
}
function goSlide(i,smooth){const c=$('car');if(!c)return;const N=c.children.length;S.slide=Math.max(0,Math.min(N-1,i));c.scrollTo({left:S.slide*c.clientWidth,behavior:smooth?'smooth':'auto'});syncDots()}
function syncDots(){const c=$('car');if(!c)return;const N=c.children.length;[...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k===S.slide));$('cprev').disabled=S.slide===0;$('cnext').style.visibility=S.slide===N-1?'hidden':'visible'}

function spark(j){
 const h=S.hist.slice(-8),n=h.length;if(n<2)return'';
 return `<svg width="64" height="22" viewBox="0 0 64 22" aria-hidden="true"><polyline points="${h.map((s,i)=>(i*64/(n-1)).toFixed(1)+','+(20-s.v[j]).toFixed(1)).join(' ')}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/></svg>`;
}

function market(){
 const prev=S.hist.length>1?S.hist[S.hist.length-2].v:null;
 const order=S.players.map((p,i)=>({...p,i})).sort((a,b)=>b.v-a.v);const rank={};order.forEach((p,r)=>rank[p.i]=r+1);
 return `<div><section class="market"><div class="row2"><span class="blk" style="font-size:18px">The market</span><span style="font-weight:700;font-size:13px;opacity:.8">stock value 0–20</span></div><div class="fig"><svg id="chart" role="img" aria-label="Stock value of each player after every turn"></svg></div></section>
 <div class="tiles">${S.players.map((p,i)=>{const d=prev?p.v-prev[i]:0,on=i===S.cur;return`<button class="tile ${on?'on':''}" style="--c:${p.c};--k:${p.k}" data-a="pick" data-i="${i}" aria-pressed="${on}" aria-label="${esc(p.name)}, stock ${p.v}">${on?'<span class="badge blk">ON STAGE</span>':''}<span class="rank blk">${rank[i]}</span><span class="nm">${esc(p.name)}</span><span style="display:flex;align-items:flex-end;justify-content:space-between;gap:6px"><span><span class="v blk">${p.v}</span><br><span class="d blk">${d>0?'▲ +'+d:d<0?'▼ '+d:'—'}</span></span>${spark(i)}</span></button>`}).join('')}</div></div>`;
}

function ringSvg(stroke){const R=2*Math.PI*44,frac=Math.max(0,tLeft)/maxT();return`<svg width="100%" height="100%" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="${stroke}"/><circle cx="50" cy="50" r="44" fill="none" stroke="${tLeft<=10&&tLeft<maxT()?'#FBF9F4':'currentColor'}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(frac*R).toFixed(1)} ${R.toFixed(1)}" transform="rotate(-90 50 50)"/></svg>`}
function stage(still){
 const pc=still?'':' pop',p=S.players[S.cur],c=CATS[S.cat],m=S.mods,st=STAKE[S.risk];
 let up=st[0],dn=m.safety?0:st[1];if(m.dbl){up*=2;dn*=2}
 const clock=tLeft>0?fmt(tLeft):'TIME!',L=S.last;
 let cc=c.c,ck=c.t,miniT=esc(p.name),miniS=`${c.k} · ${S.risk==='H'?'High':'Low'} risk`,miniR=clock;
 if(S.stage==='done'){cc=L.freeze?'#F1E8DA':L.ok?'#523A85':'#D95536';ck=L.freeze?'#2A110D':'#FBF9F4';miniT=L.freeze?'Market freeze':L.ok?'Success':'Fail';miniS='Tap to see the result';miniR=(L.d>0?'+':'')+L.d}
 if(S.stage==='tie'){cc='#F07A5C';ck='#2A110D';miniT='Tie · final pitch';miniS=esc(p.name)+' has 15 seconds'}
 const mini=`<button class="mini" style="--cc:${cc};--ck:${ck}" data-a="sheetopen" data-sw="1" aria-label="Open the On stage panel"><span class="mt"><span>ON STAGE</span><b class="blk">${miniT}</b><span>${miniS}</span></span><span class="mclock blk">${miniR}</span><span aria-hidden="true" style="font-size:20px">▲</span></button>`;
 const handle=`<button class="handle" data-a="sheetclose" data-sw="1" aria-label="Fold the panel"></button>`;
 let full;
 if(S.stage==='done'){const ok=L.ok;
  full=`<section class="card${pc}" style="--cc:${cc};--ck:${ck}">${handle}<div class="ctop"><div><span class="blk" style="font-size:12px;letter-spacing:.08em">VERDICT · ${esc(p.name)}</span><div class="who blk">${L.freeze?'MARKET FREEZE':ok?'SUCCESS':'FAIL'}</div><span class="sub">${esc(p.name)} is now at ${p.v}</span></div><div class="blk" style="font-size:56px;line-height:1">${L.d>0?'+':''}${L.d}</div></div>
  <div class="cbody"><p class="hint" style="font-size:15px;color:var(--dk)">${L.freeze?'Still a tie: all bets are cancelled. Give every coin back to its owner.':'Reveal the BUY / SELL cards and pay the bets on the table.'}</p><button class="big blk" style="background:var(--dk);color:var(--bg)" data-a="next">NEXT PERFORMER →</button><div class="row2">${L.freeze?'<span></span>':'<button class="lnk" data-a="appeal">Appeal won: flip the verdict</button>'}<button class="undo" data-a="undo">↺ Undo</button></div></div></section>`;
 }else if(S.focus){
  full=`<section class="card${pc}" style="--cc:${cc};--ck:${ck}">${handle}<div class="ctop" style="flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px 18px 22px"><div><span class="blk" style="font-size:12px;letter-spacing:.08em">${S.stage==='tie'?'FINAL PITCH':'ON STAGE'}</span><div class="who blk">${esc(p.name)}</div><span class="sub">${S.stage==='tie'?'Convince the table!':c.k+' · '+(S.risk==='H'?'High':'Low')+' risk'}</span></div>
  <button class="bigring" data-a="tgo" aria-label="${tRun?'Pause':'Start'} the timer">${ringSvg(8)}<span class="blk" role="timer">${clock}<small>${tLeft<=0?'time is up':tRun?'tap to pause':'tap to start'}</small></span></button></div>
  <div class="focus"><div class="fctl"><button style="background:var(--sand)" data-a="treset" aria-label="Reset timer">↺ Reset</button><button class="blk" style="background:var(--dk);color:var(--bg);letter-spacing:.06em" data-a="tgo">${tRun?'PAUSE':tLeft>0&&tLeft<maxT()?'RESUME':'START'}</button><button style="background:var(--sand)" data-a="plus">+15 s</button></div>
  ${tLeft<=0?'<button class="big blk" style="background:var(--red);color:var(--bg)" data-a="unfocus">GO TO VERDICT →</button>':''}
  <div class="row2" style="width:100%;max-width:380px"><button class="lnk" data-a="unfocus">⚙ Round settings</button><button class="lnk" data-a="unfocus">Verdict →</button></div></div></section>`;
 }else if(S.stage==='tie'){
  full=`<section class="card${pc}" style="--cc:${cc};--ck:${ck}">${handle}<div class="ctop"><div><span class="blk" style="font-size:12px;letter-spacing:.08em">IT'S A TIE</span><div class="who blk">Final pitch</div><span class="sub">${esc(p.name)} has 15 seconds to convince the table.</span></div>
  <button class="ring" data-a="focus" aria-label="Open the timer">${ringSvg(10)}<span class="blk" role="timer">${clock}</span></button></div>
  <div class="cbody"><span style="font-weight:700">Then the table votes again:</span>
  <div class="verd3"><button class="vb blk" style="background:var(--red)" data-a="verdict" data-ok="0">FAIL<small>${dn?dn:'±0'}</small></button><button class="vb tie blk" data-a="freeze">TIE<small>freeze</small></button><button class="vb blk" style="background:var(--pu)" data-a="verdict" data-ok="1">SUCCESS<small>+${up}</small></button></div>
  <p class="hint">Still a tie: the stock doesn't move and all bets are paid back.</p><div class="row2"><span></span><button class="undo" data-a="untie">↺ Undo</button></div></div></section>`;
 }else{
  full=`<section class="card${pc}" style="--cc:${cc};--ck:${ck}">${handle}<div class="ctop"><div><span class="blk" style="font-size:12px;letter-spacing:.08em">ON STAGE</span><div class="who blk">${esc(p.name)}</div><span class="sub">${c.k} · ${S.risk==='H'?'High risk':'Low risk'}</span></div>
  <button class="ring" data-a="focus" aria-label="Open the timer">${ringSvg(10)}<span class="blk" role="timer">${clock}</span></button></div>
  <div class="cbody">
  <div class="tokens" role="group" aria-label="Category">${CATS.map((k,i)=>`<button class="tok" style="--c:${k.c}" data-a="cat" data-i="${i}" aria-pressed="${i===S.cat}"><i></i>${k.s}</button>`).join('')}</div>
  <div class="seg" role="group" aria-label="Risk"><button data-a="risk" data-r="L" aria-pressed="${S.risk==='L'}">Low · +1 / −1</button><button data-a="risk" data-r="H" aria-pressed="${S.risk==='H'}">High · +3 / −2</button></div>
  <div class="mods" role="group" aria-label="Bonus and malus cards">${[['short','Short Clock'],['safety','Safety Net'],['dbl','Double Up']].map(([k,t])=>`<button class="mod" data-a="mod" data-k="${k}" aria-pressed="${m[k]}">${t}</button>`).join('')}</div>
  <div class="ctl"><button class="go blk" data-a="focus">${tRun?'TIMER RUNNING':tLeft>0&&tLeft<maxT()?'RESUME':'START '+maxT()+' S'}</button>${m.short?'':[30,45,60,90].map(s=>`<button class="sm" data-a="sec" data-s="${s}" aria-pressed="${s===S.sec}">${s}</button>`).join('')}</div>
  <div class="verd3" id="verd"><button class="vb blk" style="background:var(--red)" data-a="verdict" data-ok="0">FAIL<small>${dn?dn:'±0'}</small></button><button class="vb tie blk" data-a="tie">TIE<small>final pitch</small></button><button class="vb blk" style="background:var(--pu)" data-a="verdict" data-ok="1">SUCCESS<small>+${up}</small></button></div>
  <p class="hint">Majority vote of the table. A tie gives the Performer a 15-second final pitch.</p></div></section>`;
 }
 return mini+`<div class="full">${full}</div>`;
}

function endScreen(){
 const rows=S.players.map(p=>{const c=+S.coins[p.tk]||0;return{...p,f:c+p.v*2}}).sort((a,b)=>b.f-a.f);
 const filled=Object.values(S.coins).some(v=>+v>0),pod=[rows[1],rows[0],rows[2]],H=[150,190,130];
 return `<section style="display:flex;flex-direction:column;gap:18px;max-width:900px;margin:0 auto;width:100%">
 <div class="hero"><svg width="80" height="100" aria-hidden="true"><use href="#wolf"/></svg><div><span class="hint">${filled?'The Wolf of Work Street is':'Final settlement'}</span><h1 class="blk" style="font-size:clamp(30px,6vw,48px)">${filled?esc(rows[0].name):'Count your coins'}</h1></div></div>
 ${filled?`<div class="podium">${pod.map((p,i)=>p?`<div class="pod" style="--c:${p.c};--k:${p.k};height:${H[i]}px"><span>${esc(p.name)}</span><b class="blk">${p.f}</b><small style="font-weight:700">${i===1?'1st':i===0?'2nd':'3rd'}</small></div>`:'<div></div>').join('')}</div>`:''}
 <p class="hint">Type the Soft Coins each player has on the table. Fortune = coins + stock × 2.</p>
 <div class="coins">${rows.map(p=>`<div class="cn"><span style="width:14px;height:40px;border-radius:7px;background:${p.c};flex:none"></span><span class="nm">${esc(p.name)}<small>stock ${p.v} × 2</small></span><input type="number" min="0" inputmode="numeric" value="${S.coins[p.tk]??''}" placeholder="0" data-c="${esc(p.tk)}" aria-label="Soft Coins of ${esc(p.name)}"><b class="f blk">${p.f}</b></div>`).join('')}</div>
 <button class="big blk" style="background:var(--or)" data-a="new">NEW GAME</button></section>`;
}

function render(){
 pills();const a=$('app');
 if(S.phase==='setup')a.innerHTML=setup();
 else if(S.phase==='rules'){a.innerHTML=rulesScreen();const c=$('car');requestAnimationFrame(()=>goSlide(S.slide||0,false));let t;c.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{const k=Math.round(c.scrollLeft/c.clientWidth);if(k!==S.slide){S.slide=k;syncDots();save()}},80)})}
 else if(S.phase==='end')a.innerHTML=endScreen();
 else{a.innerHTML=`<div class="main"><div id="stageCol" class="${S.sheet?'open':''}">${stage()}</div>${market()}</div><div id="scrim" class="${S.sheet&&phone()?'on':''}" data-a="sheetclose"></div>`;drawChart()}
 save();
}
function paintStage(){const col=$('stageCol');if(!col)return;col.innerHTML=stage(true);col.classList.toggle('open',!!S.sheet);const sc=$('scrim');if(sc)sc.classList.toggle('on',!!S.sheet&&phone())}

let ro;
function drawChart(){
 const s=$('chart');if(!s)return;
 const W=s.clientWidth,H=s.clientHeight,n=S.hist.length,pad={l:22,r:46,t:10,b:18};
 const x=i=>pad.l+(n<2?0:i*(W-pad.l-pad.r)/(n-1)),y=v=>pad.t+(20-v)*(H-pad.t-pad.b)/20;
 let g='';[0,10,20].forEach(v=>{g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#FBF9F4" stroke-opacity=".18"/><text x="${pad.l-6}" y="${y(v)+4}" fill="#FBF9F4" fill-opacity=".7" font-size="11" text-anchor="end" font-family="Archivo" font-weight="700">${v}</text>`});
 S.hist.forEach((h,i)=>{if(h.l==='news')g+=`<circle cx="${x(i)}" cy="${H-pad.b+8}" r="4" fill="#E59F48"/>`});
 const many=S.players.length>8,labels=[];
 S.players.forEach((p,j)=>{const on=j===S.cur,pts=S.hist.map((h,i)=>x(i).toFixed(1)+','+y(h.v[j]).toFixed(1)).join(' ');
  if(on)return;g+=`<polyline points="${pts}" fill="none" stroke="${LINE[j%8]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="${many?.35:.75}"/>`;labels.push({y:y(S.hist[n-1].v[j]),c:LINE[j%8],t:p.tk})});
 const cp=S.players[S.cur],cj=S.cur,cpts=S.hist.map((h,i)=>x(i).toFixed(1)+','+y(h.v[cj]).toFixed(1)).join(' ');
 g+=`<polyline points="${cpts}" fill="none" stroke="#FBF9F4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n-1)}" cy="${y(S.hist[n-1].v[cj])}" r="6" fill="#E59F48" stroke="#FBF9F4" stroke-width="3"/>`;
 labels.push({y:y(S.hist[n-1].v[cj]),c:'#FBF9F4',t:cp.tk,on:1});
 labels.sort((a,b)=>a.y-b.y);let last=-99;
 if(!many)labels.forEach(l=>{const yy=Math.max(l.y+4,last+12);last=yy;g+=`<text x="${W-pad.r+8}" y="${yy}" fill="${l.c}" font-size="11" font-family="Archivo Black">${esc(l.t)}</text>`});
 else g+=`<text x="${W-pad.r+8}" y="${y(S.hist[n-1].v[cj])+4}" fill="#FBF9F4" font-size="11" font-family="Archivo Black">${esc(cp.tk)}</text>`;
 s.innerHTML=g;
 if(!ro)ro=new ResizeObserver(()=>drawChart());ro.disconnect();ro.observe(s);
}

function tick(){
 if(!tRun)return;tLeft--;
 if(tLeft<=5&&tLeft>0)beep(880,.12);
 if(tLeft<=0){tRun=false;clearInterval(tInt);beep(440,.7);try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
 paintStage();
}
function resetTimer(){tRun=false;clearInterval(tInt);tLeft=maxT()}
function applyVerdict(ok,from){const p=S.players[S.cur],st=STAKE[S.risk];let d=ok?st[0]:(S.mods.safety?0:st[1]);if(S.mods.dbl)d*=2;p.v=clamp(from+d);return p.v-from}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i;
 if(a==='install'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()});return}
 if(a==='add'){S.names.push('');render();const ins=document.querySelectorAll('#names input');ins[ins.length-1].focus();return}
 if(a==='rm')S.names.splice(i,1);
 if(a==='gm')S.gameMin=Math.max(10,Math.min(120,S.gameMin+ +b.dataset.d));
 if(a==='start'){const names=S.names.map(n=>n.trim()).filter(Boolean);if(names.length<4){alertBox('You need at least 4 players.');return}S.phase='rules';S.slide=0;render();scrollTo(0,0);return}
 if(a==='no'){S.phase='setup';S.slide=0;render();scrollTo(0,0);return}
 if(a==='skip'){goSlide(SLIDES.length,true);return}
 if(a==='prev'){goSlide(S.slide-1,true);return}
 if(a==='nextslide'){goSlide(S.slide+1,true);return}
 if(a==='sheetopen'){S.sheet=true;paintStage();save();return}
 if(a==='sheetclose'){S.sheet=false;paintStage();save();return}
 if(a==='endask'){$('modal').innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="eq"><div class="card news pop" style="--cc:#2A110D;--ck:#FBF9F4"><div class="ctop"><span class="blk" style="font-size:12px;letter-spacing:.08em">END GAME</span><h3 class="blk" id="eq">End the game now?</h3></div><div class="cbody"><p>You will go to the final settlement. You can still come back to the game.</p><div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="big blk" style="background:var(--sand)" data-a="alertok">NO</button><button class="big blk" style="background:var(--red);color:var(--bg)" data-a="end">YES</button></div></div></div></div>`;return}
 if(a==='focus'){S.focus=true;S.sheet=true;if(!tRun&&tLeft>0){tRun=true;clearInterval(tInt);beep(660,.08);tInt=setInterval(tick,1000)}paintStage();save();return}
 if(a==='unfocus'){S.focus=false;paintStage();save();const v=$('verd');v&&v.scrollIntoView({block:'nearest'});return}
 if(a==='plus'){tLeft+=15;paintStage();return}
 if(a==='tie'){resetTimer();S.stage='tie';S.focus=false;resetTimer();paintStage();save();return}
 if(a==='untie'){S.stage='pick';S.focus=false;resetTimer();paintStage();save();return}
 if(a==='freeze'){resetTimer();const p=S.players[S.cur];S.last={ok:null,d:0,prev:p.v,freeze:true};S.stage='done';S.focus=false;S.sheet=true;snap('turn');beep(330,.3)}
 if(a==='yes'){const names=S.names.map(n=>n.trim()).filter(Boolean);
  const used={};S.players=names.map((n,j)=>{let tk=n.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'P'+(j+1);while(used[tk])tk=tk.slice(0,2)+(j+1);used[tk]=1;return{name:n,tk,v:10,c:COLS[j%6][0],k:COLS[j%6][1]}});
  Object.assign(S,{phase:'play',hist:[],turn:0,cur:0,cat:0,risk:'L',sec:45,stage:'pick',coins:{},sheet:true,focus:false,slide:0,gameEnd:Date.now()+S.gameMin*60000,mods:{short:false,safety:false,dbl:false}});snap('start');resetTimer();scrollTo(0,0)}
 if(a==='pick'&&S.stage==='pick'){S.cur=i;S.focus=false;S.sheet=true;resetTimer()}
 if(a==='cat')S.cat=i;
 if(a==='risk'){S.risk=b.dataset.r;S.sec=S.risk==='H'?60:45;resetTimer()}
 if(a==='mod'){S.mods[b.dataset.k]=!S.mods[b.dataset.k];if(b.dataset.k==='short')resetTimer()}
 if(a==='sec'){S.sec=+b.dataset.s;resetTimer()}
 if(a==='tgo'){if(tLeft<=0)resetTimer();tRun=!tRun;clearInterval(tInt);if(tRun){beep(660,.08);tInt=setInterval(tick,1000)};paintStage();return}
 if(a==='treset')resetTimer();
 if(a==='verdict'){resetTimer();const ok=b.dataset.ok==='1',p=S.players[S.cur],prev=p.v,d=applyVerdict(ok,prev);S.last={ok,d,prev};S.stage='done';S.focus=false;S.sheet=true;snap('turn');beep(ok?990:220,.25)}
 if(a==='appeal'&&S.last&&!S.last.freeze){const L=S.last;L.ok=!L.ok;L.d=applyVerdict(L.ok,L.prev);S.hist[S.hist.length-1].v[S.cur]=S.players[S.cur].v}
 if(a==='undo'&&S.last){S.players[S.cur].v=S.last.prev;S.hist.pop();S.stage='pick';S.last=null;resetTimer()}
 if(a==='next'){S.turn++;S.last=null;S.stage='pick';S.mods={short:false,safety:false,dbl:false};S.risk='L';S.sec=45;S.focus=false;S.cur=(S.cur+1)%S.players.length;resetTimer();if(S.cur===0){render();drawNews();return}}
 if(a==='newsok'){$('modal').innerHTML=''}
 if(a==='alertok'){$('modal').innerHTML='';return}
 if(a==='end'){tRun=false;clearInterval(tInt);S.phase='end';$('modal').innerHTML='';scrollTo(0,0)}
 if(a==='back')S.phase='play';
 if(a==='new')S={...fresh(),names:S.players.map(p=>p.name),gameMin:S.gameMin};
 render();
 if(S.phase==='play')keepAwake();else letSleep();
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.n!==undefined){S.names[+t.dataset.n]=t.value;save()}
 if(t.dataset.c!==undefined){S.coins[t.dataset.c]=t.value;const id=t.dataset.c;render();const n=document.querySelector(`[data-c="${CSS.escape(id)}"]`);if(n){n.focus();const v=n.value;n.value='';n.value=v}}
});
function drawNews(){
 const k=Math.floor(Math.random()*NEWS.length),N=NEWS[k],eff=N.f(S.players);S.players.forEach(p=>p.v=clamp(p.v));snap('news');
 const c=NC[k%4];
 $('modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="nt"><div class="card news pop" style="--cc:${c};--ck:${c==='#E59F48'?'#2A110D':'#FBF9F4'}"><div class="ctop"><span class="blk" style="font-size:12px;letter-spacing:.08em">MARKET NEWS · END OF ROUND ${round()-1}</span><h3 class="blk" id="nt">${N.t}</h3></div><div class="cbody"><p>${N.d}</p><div class="eff">${esc(eff)}</div><button class="big blk" style="background:var(--dk);color:var(--bg)" data-a="newsok">BACK TO TRADING</button></div></div></div>`;
 render();beep(523,.15);setTimeout(()=>beep(784,.25),160);
 const btn=document.querySelector('[data-a=newsok]');btn&&btn.focus();
}
function alertBox(msg){$('modal').innerHTML=`<div class="modal" role="alertdialog" aria-modal="true"><div class="card news pop" style="--cc:#D95536;--ck:#FBF9F4"><div class="ctop"><h3 class="blk">Wait!</h3></div><div class="cbody"><p>${esc(msg)}</p><button class="big blk" style="background:var(--dk);color:var(--bg)" data-a="alertok">OK</button></div></div></div>`}

let ty=null;
document.addEventListener('touchstart',e=>{const t=e.target.closest('[data-sw]');ty=t?e.touches[0].clientY:null},{passive:true});
document.addEventListener('touchend',e=>{if(ty===null)return;const dy=e.changedTouches[0].clientY-ty;ty=null;if(Math.abs(dy)<40)return;S.sheet=dy<0;paintStage();save()},{passive:true});
document.addEventListener('keydown',e=>{if(S.phase==='rules'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.target.closest('input')){goSlide(S.slide+(e.key==='ArrowRight'?1:-1),true)}
 if(e.key==='Escape'&&S.phase==='play'&&S.sheet&&phone()){S.sheet=false;paintStage();save()}});
addEventListener('resize',()=>{const sc=$('scrim');if(sc)sc.classList.toggle('on',!!S.sheet&&phone());if(S.phase==='rules')goSlide(S.slide,false)});
let bellRung=false;
setInterval(()=>{if(S.phase!=='play'&&S.phase!=='end')return;const g=$('gclock');if(!g)return;const left=Math.round((S.gameEnd-Date.now())/1000);
 if(left<=0){if(!bellRung){bellRung=true;beep(392,.4);setTimeout(()=>beep(392,.6),450);pills()}}else g.querySelector('b').textContent=fmt(left)},1000);
if(S.phase==='play')resetTimer();
render();
}
</script>
</body>
</html>
